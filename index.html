<title>Content Ecosystem Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    color-scheme: light;
    --page:#f9f9f7; --surface:#fcfcfb; --surface-raised:#ffffff;
    --ink:#0b0b0b; --ink-2:#52514e; --ink-muted:#898781;
    --gridline:#e1e0d9; --border:rgba(11,11,11,0.10);
    --accent:#6B4A33; --accent-ink:#ffffff; --accent-tint:#efe6df;
    --good:#0ca30c; --warning:#c98500; --critical:#d03b3b;
    --good-tint:#e6f5e6; --warning-tint:#fbeed4; --critical-tint:#fbe4e2;

    --p-career:#2a78d6;         --p-career-tint:#e4eefa;
    --p-orinti:#eb6834;         --p-orinti-tint:#fcece3;
    --p-eluk:#1baf7a;           --p-eluk-tint:#e2f5ee;
    --p-studies:#c98500;        --p-studies-tint:#fbeed4;
    --p-mindset:#c14a76;        --p-mindset-tint:#fae4ed;
    --p-money:#1f7a1f;          --p-money-tint:#e3f0e3;
    --p-representation:#4a3aa7; --p-representation-tint:#e9e6f7;
    --p-lifestyle:#c9403f;      --p-lifestyle-tint:#fae3e2;

    --obj-growth:#2a78d6; --obj-orinti:#eb6834; --obj-eluk:#1baf7a;

    /* single-hue ordinal ramp for the per-platform chart — always paired with a text label */
    --plat-tiktok:#3f2a1c; --plat-instagram:#835a3a; --plat-linkedin:#c9a06c;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --page:#0d0d0d; --surface:#1a1a19; --surface-raised:#202220;
      --ink:#ffffff; --ink-2:#c3c2b7; --ink-muted:#948f86;
      --gridline:#2c2c2a; --border:rgba(255,255,255,0.12);
      --accent:#d9b483; --accent-ink:#241b12; --accent-tint:#332821;
      --good:#3ecb3e; --warning:#f0ae5c; --critical:#e66767;
      --good-tint:#123312; --warning-tint:#3a2c14; --critical-tint:#3a1b19;

      --p-career:#3987e5;         --p-career-tint:#122238;
      --p-orinti:#d95926;         --p-orinti-tint:#33200f;
      --p-eluk:#199e70;           --p-eluk-tint:#0f2c22;
      --p-studies:#e0a53c;        --p-studies-tint:#332812;
      --p-mindset:#d55181;        --p-mindset-tint:#331c26;
      --p-money:#4fae4f;          --p-money-tint:#122b12;
      --p-representation:#9085e9; --p-representation-tint:#231f3d;
      --p-lifestyle:#e66767;      --p-lifestyle-tint:#331917;

      --obj-growth:#3987e5; --obj-orinti:#d95926; --obj-eluk:#199e70;

      --plat-tiktok:#6b4f2e; --plat-instagram:#a37f4e; --plat-linkedin:#d9b483;
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --surface-raised:#202220;
    --ink:#ffffff; --ink-2:#c3c2b7; --ink-muted:#948f86;
    --gridline:#2c2c2a; --border:rgba(255,255,255,0.12);
    --accent:#d9b483; --accent-ink:#241b12; --accent-tint:#332821;
    --good:#3ecb3e; --warning:#f0ae5c; --critical:#e66767;
    --good-tint:#123312; --warning-tint:#3a2c14; --critical-tint:#3a1b19;

    --p-career:#3987e5;         --p-career-tint:#122238;
    --p-orinti:#d95926;         --p-orinti-tint:#33200f;
    --p-eluk:#199e70;           --p-eluk-tint:#0f2c22;
    --p-studies:#e0a53c;        --p-studies-tint:#332812;
    --p-mindset:#d55181;        --p-mindset-tint:#331c26;
    --p-money:#4fae4f;          --p-money-tint:#122b12;
    --p-representation:#9085e9; --p-representation-tint:#231f3d;
    --p-lifestyle:#e66767;      --p-lifestyle-tint:#331917;

    --obj-growth:#3987e5; --obj-orinti:#d95926; --obj-eluk:#199e70;

    --plat-tiktok:#6b4f2e; --plat-instagram:#a37f4e; --plat-linkedin:#d9b483;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--page); color:var(--ink);
    font-family:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size:15px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{ font-family:"Fraunces", Georgia, serif; font-weight:600; text-wrap:balance; margin:0; }
  a{color:inherit;}
  button{font-family:inherit;}
  ::selection{ background:var(--accent-tint); }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .app{ display:grid; grid-template-columns:220px 1fr; min-height:100vh; }
  @media (max-width:840px){ .app{ grid-template-columns:1fr; } .rail{ position:static; flex-direction:row; overflow-x:auto; border-right:none; border-bottom:1px solid var(--border); } .rail-title{display:none;} }

  .rail{
    position:sticky; top:0; align-self:start; height:100vh;
    display:flex; flex-direction:column; gap:4px;
    padding:22px 14px; border-right:1px solid var(--border);
    background:var(--surface);
  }
  .rail-brand{ padding:2px 10px 18px; }
  .rail-brand .eyebrow{ font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-muted); font-weight:600; }
  .rail-brand h1{ font-size:20px; margin-top:4px; border-bottom:2px solid var(--accent); display:inline-block; padding-bottom:4px; }
  .nav-tab{
    display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px;
    color:var(--ink-2); font-weight:600; font-size:14px; cursor:pointer; border:1px solid transparent;
    background:transparent; text-align:left; white-space:nowrap;
  }
  .nav-tab:hover{ background:var(--accent-tint); color:var(--ink); }
  .nav-tab[aria-current="true"]{ background:var(--ink); color:var(--surface); }
  .nav-tab .count{ margin-left:auto; font-size:12px; color:var(--ink-muted); font-variant-numeric:tabular-nums; }
  .nav-tab[aria-current="true"] .count{ color:var(--surface); opacity:.7; }
  .rail-foot{ margin-top:auto; padding:10px; display:flex; flex-direction:column; gap:8px; }
  .rail-foot button{ font-size:12px; }

  main{ padding:28px 32px 80px; max-width:1180px; }
  @media (max-width:640px){ main{ padding:18px 16px 60px; } }

  .page-head{ margin-bottom:22px; }
  .page-head .eyebrow{ font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-muted); font-weight:600; }
  .page-head h2{ font-size:26px; margin-top:4px; }
  .page-head p{ color:var(--ink-2); max-width:60ch; margin-top:6px; }

  .card{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:20px; }
  .grid{ display:grid; gap:16px; }
  .stat-row{ grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); margin-bottom:16px; }
  .stat-tile .label{ font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-muted); font-weight:600; }
  .stat-tile .value{ font-family:"Fraunces",serif; font-size:34px; margin-top:6px; font-variant-numeric:tabular-nums; }
  .stat-tile .sub{ font-size:12.5px; color:var(--ink-2); margin-top:4px; }

  .section-title{ font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-muted); font-weight:700; margin-bottom:10px; }

  /* --- objective balance bar --- */
  .balance-legend{ display:flex; gap:18px; flex-wrap:wrap; margin-bottom:12px; font-size:13px; }
  .balance-legend .item{ display:flex; align-items:center; gap:7px; color:var(--ink-2); }
  .swatch{ width:10px; height:10px; border-radius:3px; flex:none; }
  .balance-track{ position:relative; height:26px; border-radius:8px; overflow:hidden; background:var(--gridline); display:flex; }
  .balance-seg{ height:100%; position:relative; min-width:2px; }
  .balance-seg + .balance-seg{ border-left:2px solid var(--surface); }
  .balance-ticks{ position:relative; height:14px; margin-top:2px; }
  .balance-tick{ position:absolute; top:0; width:1px; height:8px; background:var(--ink-muted); }
  .balance-tick::after{ content:attr(data-label); position:absolute; top:10px; left:50%; transform:translateX(-50%); font-size:10px; color:var(--ink-muted); white-space:nowrap; }
  .balance-readout{ display:grid; gap:8px; margin-top:16px; }
  .balance-row{ display:flex; align-items:center; gap:10px; font-size:13.5px; }
  .balance-row .name{ flex:none; width:230px; color:var(--ink-2); display:flex; align-items:center; gap:7px; }
  .balance-row .pct{ font-variant-numeric:tabular-nums; font-weight:600; }
  .status-chip{ display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; padding:3px 8px; border-radius:999px; }
  .status-chip.good{ background:var(--good-tint); color:var(--good); }
  .status-chip.warning{ background:var(--warning-tint); color:var(--warning); }
  .status-chip.critical{ background:var(--critical-tint); color:var(--critical); }

  /* independent per-platform bars — shares can exceed 100% combined since a
     cross-posted idea counts toward more than one platform */
  .plat-bars{ display:grid; gap:14px; }
  .plat-row-head{ display:flex; align-items:center; justify-content:space-between; font-size:13.5px; margin-bottom:6px; }
  .plat-row-head .name{ display:flex; align-items:center; gap:7px; color:var(--ink-2); font-weight:600; }
  .plat-row-head .plat-stats{ display:flex; align-items:center; gap:8px; color:var(--ink-2); font-variant-numeric:tabular-nums; }
  .plat-track{ height:10px; border-radius:999px; background:var(--gridline); overflow:hidden; }
  .plat-fill{ height:100%; border-radius:999px; }

  /* --- production / batch prep --- */
  .prep-channel{ margin-top:24px; }
  .prep-channel:first-of-type{ margin-top:0; }
  .prep-channel-title{ font-size:16px; margin-bottom:12px; }
  .prep-slots{ display:grid; gap:14px; grid-template-columns:repeat(auto-fill, minmax(300px,1fr)); align-items:start; }
  .prep-card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .prep-card.empty{ border-style:dashed; justify-content:center; align-items:flex-start; min-height:120px; gap:10px; }
  .prep-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  .prep-meta{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .prep-slot-label{ font-size:11px; text-transform:uppercase; letter-spacing:.04em; font-weight:700; color:var(--ink-muted); }
  .prep-title-row{ display:flex; align-items:center; gap:8px; }
  .prep-title-row .prep-title{ flex:1; font-size:14.5px; cursor:pointer; }
  .prep-title-row .prep-title:hover{ text-decoration:underline; text-decoration-color:var(--accent); }
  .prep-date{ flex:none; width:132px; font-size:12px; padding:5px 7px; }
  .script-box{ width:100%; min-height:130px; font-size:13.5px; line-height:1.6; font-family:inherit; }
  .status-seg{ display:inline-flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; align-self:flex-start; }
  .status-seg button{ border:none; background:var(--surface-raised); padding:6px 10px; font-size:11px; font-weight:700; color:var(--ink-2); cursor:pointer; }
  .status-seg button + button{ border-left:1px solid var(--border); }
  .status-seg button.active{ background:var(--ink); color:var(--surface); }
  .status-seg button:hover:not(.active){ background:var(--accent-tint); }

  .channel-block + .channel-block{ margin-top:18px; padding-top:16px; border-top:1px solid var(--gridline); }
  .channel-head{ display:flex; align-items:baseline; justify-content:space-between; font-size:14px; }
  .channel-sub{ font-size:12px; color:var(--ink-muted); font-weight:600; font-variant-numeric:tabular-nums; }
  .checklist{ display:grid; gap:10px; margin-top:8px; }
  .mini-list{ list-style:none; margin:8px 0 0; padding:0; display:grid; gap:4px; }
  .mini-item{
    display:flex; align-items:center; gap:8px; font-size:12px; color:var(--ink-2);
    padding:5px 7px; border-radius:7px; cursor:pointer; background:var(--surface-raised); border:1px solid var(--border);
  }
  .mini-item:hover{ background:var(--accent-tint); }
  .mini-when{ flex:none; color:var(--ink-muted); font-weight:600; font-variant-numeric:tabular-nums; }
  .mini-title{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink); font-weight:500; }
  .check-item{ display:flex; align-items:center; gap:10px; padding:10px 12px; border:1px solid var(--border); border-radius:10px; font-size:13.5px; }
  .check-item .dot{ width:20px; height:20px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; }
  .check-item.met .dot{ background:var(--good-tint); color:var(--good); }
  .check-item.unmet .dot{ background:var(--critical-tint); color:var(--critical); }
  .check-item .txt b{ font-weight:700; }
  .check-item .txt span{ color:var(--ink-muted); font-size:12px; }

  /* --- pills / tags --- */
  .pill{ display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:999px; white-space:nowrap; }
  .pill .dot{ width:7px; height:7px; border-radius:50%; flex:none; }
  .pill-outline{ border:1px solid var(--border); color:var(--ink-2); font-weight:600; background:transparent; }

  /* --- calendar --- */
  .cal-toolbar{ display:flex; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
  .cal-toolbar .range{ font-weight:600; font-size:15px; margin-right:auto; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:10px; }
  @media (max-width:900px){ .cal-grid{ grid-template-columns:1fr; } }
  .day-card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:12px; min-height:170px; display:flex; flex-direction:column; gap:8px; }
  .day-card.today{ border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
  .day-head{ display:flex; align-items:baseline; justify-content:space-between; }
  .day-head .dow{ font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-muted); font-weight:700; }
  .day-head .dnum{ font-family:"Fraunces",serif; font-size:18px; }
  .day-items{ display:flex; flex-direction:column; gap:6px; flex:1; }
  .idea-chip{ border:1px solid var(--border); border-left:3px solid var(--chip-color,var(--accent)); border-radius:8px; padding:6px 8px; font-size:12.5px; cursor:pointer; background:var(--surface-raised); }
  .idea-chip:hover{ background:var(--accent-tint); }
  .idea-chip-top{ display:flex; align-items:center; justify-content:space-between; gap:6px; margin-bottom:3px; }
  .idea-chip .plat{ font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-2); }
  .idea-chip .t{ font-weight:600; display:block; margin-bottom:2px; }
  .idea-chip .meta{ color:var(--ink-muted); font-size:11px; }
  .chip-remove{
    flex:none; width:18px; height:18px; line-height:16px; text-align:center; padding:0;
    border:1px solid transparent; border-radius:50%; background:transparent; color:var(--ink-muted);
    font-size:14px; cursor:pointer;
  }
  .chip-remove:hover{ background:var(--critical-tint); color:var(--critical); border-color:var(--critical); }
  .day-add{ border:1px dashed var(--border); border-radius:8px; background:transparent; color:var(--ink-muted); font-size:12px; padding:6px; cursor:pointer; font-weight:600; }
  .day-add:hover{ color:var(--ink); border-color:var(--accent); }
  .day-empty{ color:var(--ink-muted); font-size:12px; font-style:italic; }

  /* --- idea bank --- */
  .filter-bar{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; align-items:center; }
  .filter-bar select, .filter-bar input[type=search]{ font-size:13px; }
  .idea-list{ display:grid; gap:10px; }
  .idea-row{ display:grid; grid-template-columns:1fr auto; gap:10px; align-items:center; padding:12px 14px; border:1px solid var(--border); border-radius:12px; background:var(--surface); }
  .idea-row .main{ display:flex; flex-direction:column; gap:6px; min-width:0; }
  .idea-row .title{ font-weight:600; font-size:14px; }
  .idea-row .tags{ display:flex; gap:6px; flex-wrap:wrap; }
  .idea-row .actions{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; justify-content:flex-end; }
  .empty-state{ text-align:center; padding:50px 20px; color:var(--ink-muted); }

  /* --- buttons / inputs --- */
  .btn{ font-size:12.5px; font-weight:700; padding:7px 12px; border-radius:8px; border:1px solid var(--border); background:var(--surface-raised); color:var(--ink); cursor:pointer; }
  .btn:hover{ border-color:var(--accent); }
  .btn-primary{ background:var(--ink); color:var(--surface); border-color:var(--ink); }
  .btn-primary:hover{ opacity:.88; border-color:var(--ink); }
  .btn-ghost{ background:transparent; border-color:transparent; color:var(--ink-2); }
  .btn-ghost:hover{ background:var(--accent-tint); color:var(--ink); }
  .btn-danger{ color:var(--critical); }
  .btn-sm{ padding:5px 9px; font-size:11.5px; }
  input,select,textarea{
    font-family:inherit; font-size:13.5px; padding:8px 10px; border-radius:8px;
    border:1px solid var(--border); background:var(--surface-raised); color:var(--ink);
  }
  textarea{ resize:vertical; min-height:70px; }
  label{ font-size:12px; font-weight:700; color:var(--ink-2); display:block; margin-bottom:5px; }
  .field{ display:flex; flex-direction:column; }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .check-inline{ display:flex; flex-wrap:wrap; gap:8px; }
  .check-pill{
    display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600;
    padding:7px 11px; border:1px solid var(--border); border-radius:8px; cursor:pointer;
    color:var(--ink-2); background:var(--surface-raised); margin:0;
  }
  .check-pill:has(input:checked){ background:var(--accent-tint); border-color:var(--accent); color:var(--ink); }
  .check-pill input{ margin:0; accent-color:var(--accent); }
  .check-pill:has(input:disabled){ opacity:.7; cursor:not-allowed; }

  /* --- modal --- */
  .overlay{ position:fixed; inset:0; background:rgba(11,11,11,.45); display:flex; align-items:center; justify-content:center; padding:20px; z-index:50; }
  :root[data-theme="dark"] .overlay, :root:not([data-theme="light"]) .overlay{ background:rgba(0,0,0,.6); }
  .modal{ background:var(--surface-raised); border:1px solid var(--border); border-radius:16px; padding:24px; width:100%; max-width:520px; max-height:88vh; overflow:auto; }
  .modal h3{ font-size:20px; margin-bottom:16px; }
  .modal .grid{ margin-bottom:14px; }
  .modal-foot{ display:flex; justify-content:space-between; align-items:center; margin-top:18px; gap:10px; }
  .picker-list{ display:grid; gap:6px; max-height:280px; overflow:auto; margin-top:10px; }
  .picker-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 10px; border:1px solid var(--border); border-radius:8px; cursor:pointer; font-size:13px; }
  .picker-row:hover{ border-color:var(--accent); background:var(--accent-tint); }

  .toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--surface); padding:10px 18px; border-radius:999px; font-size:13px; font-weight:600; z-index:80; }
  .visually-hidden{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
</style>

<div class="app">
  <nav class="rail" aria-label="Views">
    <div class="rail-brand">
      <div class="eyebrow">Elizabeth Quishpi</div>
      <h1>Content Ecosystem</h1>
    </div>
    <button class="nav-tab" data-view="dashboard">Dashboard<span class="count" id="nav-count-dashboard"></span></button>
    <button class="nav-tab" data-view="calendar">Calendar<span class="count" id="nav-count-calendar"></span></button>
    <button class="nav-tab" data-view="production">Batch Prep<span class="count" id="nav-count-production"></span></button>
    <button class="nav-tab" data-view="bank">Idea Bank<span class="count" id="nav-count-bank"></span></button>
    <div class="rail-foot">
      <button class="btn btn-ghost" id="btn-export">Export JSON</button>
      <button class="btn btn-ghost" id="btn-import">Import JSON</button>
      <input type="file" id="file-import" accept="application/json" class="visually-hidden">
      <button class="btn btn-ghost" id="btn-export-csv">Export CSV</button>
      <button class="btn btn-ghost btn-danger" id="btn-reset">Reset to starter ideas</button>
    </div>
  </nav>
  <main id="main"></main>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script>
/* ============================= DATA MODEL ============================= */

const PILLARS = [
  { id:'career',         label:'Career' },
  { id:'studies',        label:'Studies & Learning' },
  { id:'lifestyle',      label:'Lifestyle' },
  { id:'mindset',        label:'Mindset' },
  { id:'representation', label:'Representation & First-Gen' },
  { id:'money',          label:'Money & Financial Literacy' },
  { id:'orinti',         label:'Orinti (Founder)' },

const STORAGE_KEY = 'contentEcosystemCalendar.v1';

function pad(n){ return n<10 ? '0'+n : ''+n; }
function toISO(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function fromISO(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function todayISO(){ return toISO(new Date()); }
function mondayOf(iso){
  const d = fromISO(iso);
  const dow = d.getDay(); // 0=Sun..6=Sat
  const diff = (dow===0? -6 : 1-dow);
  d.setDate(d.getDate()+diff);
  return toISO(d);
}
function addDays(iso,n){ const d=fromISO(iso); d.setDate(d.getDate()+n); return toISO(d); }
function fmtDay(iso){ return fromISO(iso).toLocaleDateString('en-GB',{ day:'numeric', month:'short' }); }
function fmtRange(startIso){
  const end = addDays(startIso,6);
  const s = fromISO(startIso), e = fromISO(end);
  const sameMonth = s.getMonth()===e.getMonth() && s.getFullYear()===e.getFullYear();
  const opts1 = sameMonth? {day:'numeric'} : {day:'numeric',month:'short'};
  return s.toLocaleDateString('en-GB',opts1) + ' – ' + e.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
}

  return {
    ideas: SEED_IDEAS.map(x=>({...x})),
    view: 'dashboard',
    weekStart: mondayOf(todayISO()),
    filters: { pillar:'', objective:'', platform:'', format:'', status:'', language:'', unscheduledOnly:false, q:'' },
  };
}

// Brings ideas saved by an older version of this app (single `platform`
// string, or the now-retired 'reels' id) up to the current `platforms` array
// shape, so a saved session never crashes on load after an update.
function migrateIdea(idea){
  let list = idea.platforms || (idea.platform ? [idea.platform] : ['tiktok']);
  list = list.map(p=> p==='reels' ? 'instagram' : p);
  idea.platforms = normalizePlatforms(list);
  delete idea.platform;
  return idea;
}

let state;
try{
  const raw = localStorage.getItem(STORAGE_KEY);
  state = raw ? JSON.parse(raw) : defaultState();
  if(!state.ideas || !state.ideas.length) state = defaultState();
  state.ideas = state.ideas.map(migrateIdea);
} catch(e){ state = defaultState(); }

function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

function newId(){ return 'u-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7); }

function esc(str){
  return String(str==null?'':str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

  const total = ideas.length || 1;
  return OBJECTIVES.map(o=>({ ...o, count:counts[o.id], pct: Math.round((counts[o.id]/total)*100) }));
}

function renderBalanceChart(balance){
  const segs = balance.map(o=>`<div class="balance-seg" style="width:${o.pct}%; background:var(${o.colorVar})" title="${esc(o.short)}: ${o.pct}%"></div>`).join('');
  const ticks = balance.map(o=>{
    // cumulative target position for tick placement, approximate using own target midpoint isn't exact stacked-target;
    return '';
  }).join('');
  const legend = balance.map(o=>`<div class="item"><span class="swatch" style="background:var(${o.colorVar})"></span>${esc(o.short)} — ${o.pct}% <span style="color:var(--ink-muted)">(target ${o.target}%)</span></div>`).join('');
  const rows = balance.map(o=>{
    const delta = o.pct - o.target;
    let chip;
    if(Math.abs(delta)<=6) chip = '<span class="status-chip good">On track</span>';
    else if(delta>6) chip = '<span class="status-chip warning">'+ (o.id==='orinti'?'Over-indexed':'Above target') +'</span>';
    else chip = '<span class="status-chip critical">Under-represented</span>';
    return `<div class="balance-row">
      <div class="name"><span class="swatch" style="background:var(${o.colorVar})"></span>${esc(o.label)}</div>
      <div class="pct">${o.pct}%</div>
      ${chip}
    </div>`;
  }).join('');
  return `
    <div class="balance-legend">${legend}</div>
    <div class="balance-track">${segs}</div>
    <div class="balance-readout">${rows}</div>
  `;
}

// A cross-posted idea counts toward every platform it's tagged with, so these
// shares don't sum to 100% — each platform gets its own independent bar
// (never a single stacked bar, which would only make sense for a whole).
function computePlatformBalance(items){
  const total = items.length || 1;
  return PLATFORMS.map(p=>{
    const count = items.filter(i=>i.platforms.includes(p.id)).length;
    return { ...p, count, pct: Math.round((count/total)*100) };
  });
}

function renderPlatformBalanceChart(items){
  const balance = computePlatformBalance(items);
  const rows = balance.map(p=>`
    <div class="plat-row">
      <div class="plat-row-head">
        <span class="name"><span class="swatch" style="background:var(--plat-${p.id})"></span>${esc(p.label)}</span>
        <span class="plat-stats">${p.count} post${p.count===1?'':'s'} <span class="status-chip" style="background:var(--accent-tint); color:var(--ink-2);">${p.pct}%</span></span>
      </div>
      <div class="plat-track"><div class="plat-fill" style="width:${p.pct}%; background:var(--plat-${p.id})"></div></div>
    </div>`).join('');
  return `<div class="plat-bars">${rows}</div>`;
}

function computeChannelPlan(scheduledWeek){
  return WEEKLY_PLAN.map(req=>{
    const platforms = CHANNELS[req.channel].platforms;
    const matches = scheduledWeek
      .filter(i=> i.pillar===req.pillar && i.platforms.some(p=>platforms.includes(p)))
      .sort((a,b)=> a.date.localeCompare(b.date));
    return { ...req, got:matches.length, met: matches.length>=req.need, matches };
  });
}

function miniItemRow(idea){
  return `<li class="mini-item" data-id="${idea.id}">
    <span class="mini-when">${esc(fmtDay(idea.date))}</span>
    <span class="mini-title">${esc(idea.title)}</span>
    <button class="chip-remove" data-unschedule-chip="${idea.id}" title="Remove from ${esc(fmtDay(idea.date))} — back to bank" aria-label="Remove from this day">×</button>
  </li>`;
}

function renderChannelPlan(scheduledWeek){
  const progress = computeChannelPlan(scheduledWeek);
  const section = (channelId)=>{
    const ch = CHANNELS[channelId];
    const items = progress.filter(p=>p.channel===channelId);
    const done = items.reduce((a,p)=>a+Math.min(p.got,p.need),0);
    const total = items.reduce((a,p)=>a+p.need,0);
    return `
      <div class="channel-block">
        <div class="channel-head">
          <b>${esc(ch.label)}</b>
          <span class="channel-sub">${done}/${total} this week</span>
        </div>
        <p style="color:var(--ink-muted); font-size:12px; margin:2px 0 10px;">${esc(ch.sub)}</p>
        <div class="checklist">
          ${items.map(it=>`
            <div class="check-item ${it.met?'met':'unmet'}">
              <div class="dot">${it.met?'✓':'!'}</div>
              <div class="txt">
                <b>${esc(it.label)}</b><br><span>${it.got}/${it.need} scheduled</span>
                ${it.matches.length ? `<ul class="mini-list">${it.matches.map(miniItemRow).join('')}</ul>` : ''}
              </div>
            </div>`).join('')}
        </div>
      </div>`;
  };
  return section('linkedin') + section('social');
}

/* ============================= PRODUCTION / BATCH PREP =============================

function renderProduction(){
  const weekItems = scheduledInWeek(state.weekStart);
  const plan = computeChannelPlan(weekItems);
  const usedIds = new Set();
  plan.forEach(req => req.matches.forEach(m => usedIds.add(m.id)));

  const needsScript = weekItems.filter(i=>i.status==='idea').length;
  const readyToRecord = weekItems.filter(i=>i.status==='scripted').length;
  const filmed = weekItems.filter(i=>i.status==='filmed').length;
  const posted = weekItems.filter(i=>i.status==='posted').length;
  const totalNeed = WEEKLY_PLAN.reduce((a,r)=>a+r.need,0);
  const slotsFilled = plan.reduce((a,r)=>a+Math.min(r.got,r.need),0);

  document.getElementById('main').innerHTML = `
    <div class="page-head">
      <div class="eyebrow">Production</div>

      <div class="card stat-tile"><div class="label">Ready to record</div><div class="value">${readyToRecord}</div><div class="sub">scripted, not filmed yet</div></div>
      <div class="card stat-tile"><div class="label">Filmed</div><div class="value">${filmed}</div><div class="sub">${posted} already posted</div></div>
    </div>

    <div class="prep-channel">
      <h3 class="prep-channel-title">LinkedIn</h3>
      <div class="prep-slots">${renderPrepSlots(plan.filter(p=>p.channel==='linkedin'))}</div>

    <div class="prep-channel">
      <h3 class="prep-channel-title">Instagram + TikTok</h3>
      <div class="prep-slots">${renderPrepSlots(plan.filter(p=>p.channel==='social'))}</div>

      <div class="prep-slots">${leftovers.map(i=>prepCard(i)).join('')}</div>

  document.getElementById('prep-prev').addEventListener('click', ()=>{ state.weekStart=addDays(state.weekStart,-7); save(); render(); });
  document.getElementById('prep-next').addEventListener('click', ()=>{ state.weekStart=addDays(state.weekStart,7); save(); render(); });
  document.getElementById('prep-today').addEventListener('click', ()=>{ state.weekStart=mondayOf(todayISO()); save(); render(); });

  bindProductionInteractions();

function renderPrepSlots(reqs){
  return reqs.map(req=>{
    const cards = [];
    for(let idx=0; idx<req.need; idx++){
      const m = req.matches[idx];
      const label = req.label + (req.need>1 ? ' · '+(idx+1)+' of '+req.need : '');
      cards.push(m ? prepCard(m, label) : emptySlotCard(req, label));
    }
    req.matches.slice(req.need).forEach(m=> cards.push(prepCard(m, req.label+' · extra')));
    return cards.join('');
  }).join('');
}

function readyBadge(idea){
  if(idea.status==='idea') return '<span class="status-chip critical">Needs a script</span>';
  if(idea.status==='scripted') return '<span class="status-chip good">Ready to record</span>';
  if(idea.status==='filmed') return '<span class="status-chip" style="background:var(--accent-tint); color:var(--ink-2);">🎬 Filmed</span>';
  return '<span class="status-chip good">✓ Posted</span>';
}

function prepCard(idea, slotLabel){

      <div class="prep-head">

          ${slotLabel ? `<span class="prep-slot-label">${esc(slotLabel)}</span>` : ''}
          ${pillarPill(idea.pillar)}

        </div>

function emptySlotCard(req, label){
  return `
    <div class="prep-card empty">
      <div class="prep-slot-label">${esc(label)} · not selected yet</div>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button class="btn btn-sm" data-prep-pick="${req.pillar}">+ From idea bank</button>
        <button class="btn btn-sm" data-prep-new="${req.pillar}">+ New idea</button>
      </div>
    </div>
  `;

function bindProductionInteractions(){
  bindChipInteractions(); // wires the × (unschedule) buttons on prep cards too

  document.querySelectorAll('.prep-title[data-open]').forEach(el=>{
    el.addEventListener('click', ()=> openIdeaModal(el.dataset.open));
  });
  document.querySelectorAll('.prep-date').forEach(el=>{
    el.addEventListener('change', ()=>{
      const idea = state.ideas.find(i=>i.id===el.dataset.id);
      if(idea){ idea.date = el.value || null; save(); render(); }
    });
  });
  document.querySelectorAll('.status-seg [data-set-status]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const wrap = el.closest('.status-seg');
      const idea = state.ideas.find(i=>i.id===wrap.dataset.id);
      if(idea){ idea.status = el.dataset.setStatus; save(); render(); }
    });
  });
  document.querySelectorAll('[data-prep-pick]').forEach(el=>{
    el.addEventListener('click', ()=> openPickerModal(state.weekStart, el.dataset.prepPick));
  });
  document.querySelectorAll('[data-prep-new]').forEach(el=>{
    el.addEventListener('click', ()=> openIdeaModal(null, state.weekStart, el.dataset.prepNew));
  });
  // Typing a script auto-promotes a bare idea to "scripted" — reflected instantly
  // without a full re-render so the textarea never loses focus mid-sentence.
  document.querySelectorAll('.script-box').forEach(el=>{
    el.addEventListener('input', ()=>{
      const idea = state.ideas.find(i=>i.id===el.dataset.script);
      if(!idea) return;
      idea.notes = el.value;
      if(idea.status==='idea' && el.value.trim()){
        idea.status = 'scripted';
        const card = el.closest('.prep-card');
        card?.querySelectorAll('.status-seg button').forEach(b=>{
          b.classList.toggle('active', b.dataset.setStatus==='scripted');
        });
        const badge = card?.querySelector('.prep-head .status-chip');
        if(badge) badge.outerHTML = readyBadge(idea);
      }
      save();
    });
    el.addEventListener('blur', ()=> render());
  });
}

/* ============================= IDEA BANK ============================= */
function matchesFilters(i){
  const f = state.filters;
  if(f.pillar && i.pillar!==f.pillar) return false;
  if(f.objective && PILLAR_OBJECTIVE[i.pillar]!==f.objective) return false;
  if(f.platform && !i.platforms.includes(f.platform)) return false;
  if(f.format && i.format!==f.format) return false;
  if(f.status && i.status!==f.status) return false;
  if(f.language && i.language!==f.language) return false;
  if(f.unscheduledOnly && i.date) return false;
  if(f.q && !i.title.toLowerCase().includes(f.q.toLowerCase())) return false;
  return true;
}

function openIdeaModal(id, presetDate, presetPillar){
  const editing = !!id;
  const idea = editing ? state.ideas.find(i=>i.id===id) : {
    id:null, title:'', pillar:presetPillar||'career', format:'teaching', platforms:['tiktok'],
    language:'ES', status:'idea', date: presetDate||null, notes:''
  };
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="overlay" id="modal-overlay">
      <div class="modal" role="dialog" aria-modal="true">
        <h3>${editing? 'Edit idea' : 'New idea'}</h3>
        <div class="field" style="margin-bottom:14px;">
          <label for="m-title">Title</label>
          <input id="m-title" type="text" value="${esc(idea.title)}" placeholder="e.g. How to Build Credit in the UK">
        </div>
        <div class="grid" style="grid-template-columns:1fr 1fr;">
          <div class="field"><label for="m-pillar">Pillar</label>${select('m-pillar','',PILLARS.map(p=>[p.id,p.label]),idea.pillar)}</div>
          <div class="field"><label for="m-format">Format</label>${select('m-format','',FORMATS.map(f=>[f.id,f.label]),idea.format)}</div>
          <div class="field"><label for="m-language">Language</label>${select('m-language','',LANGS.map(l=>[l.id,l.label]),idea.language)}</div>
          <div class="field"><label for="m-status">Status</label>${select('m-status','',STATUSES.map(s=>[s.id,s.label]),idea.status)}</div>
          <div class="field" style="grid-column:1/-1;">
            <label>Platforms</label>
            <div class="check-inline">
              ${PLATFORMS.map(p=>`
                <label class="check-pill">
                  <input type="checkbox" class="m-platform-cb" id="m-plat-${p.id}" value="${p.id}" ${idea.platforms.includes(p.id)?'checked':''}>
                  ${esc(p.label)}
                </label>`).join('')}
            </div>
            <p style="color:var(--ink-muted); font-size:11.5px; margin:6px 0 0;">Instagram always cross-posts to TikTok too.</p>
          </div>
          <div class="field"><label for="m-date">Scheduled date</label><input id="m-date" type="date" value="${idea.date||''}"></div>
        </div>
        <div class="field" style="margin-top:14px;">
          <label for="m-notes">Notes</label>
          <textarea id="m-notes" placeholder="Talking points, hook, references…">${esc(idea.notes||'')}</textarea>
        </div>
        <div class="modal-foot">
          <div style="display:flex; gap:8px;">
            ${editing? `<button class="btn btn-danger" id="m-delete">Delete</button>` : ''}
            ${editing && idea.date? `<button class="btn" id="m-unschedule">Remove from calendar</button>` : ''}
          </div>
          <div style="display:flex; gap:8px;">
            <button class="btn" id="m-cancel">Cancel</button>
            <button class="btn btn-primary" id="m-save">${editing?'Save changes':'Add to bank'}</button>
          </div>
        </div>
      </div>
    </div>
  `;
  document.getElementById('modal-overlay').addEventListener('click', e=>{ if(e.target.id==='modal-overlay') closeModal(); });
  document.getElementById('m-cancel').addEventListener('click', closeModal);
  // Instagram implies TikTok: lock TikTok checked+disabled while Instagram is checked.
  const igCb = document.getElementById('m-plat-instagram');
  const ttCb = document.getElementById('m-plat-tiktok');
  const syncPlatformLock = ()=>{
    if(igCb.checked){ ttCb.checked = true; ttCb.disabled = true; }
    else { ttCb.disabled = false; }
  };
  syncPlatformLock();
  igCb.addEventListener('change', syncPlatformLock);
  document.getElementById('m-delete')?.addEventListener('click', ()=>{
    if(confirm('Delete this idea?')){ state.ideas = state.ideas.filter(i=>i.id!==idea.id); save(); closeModal(); render(); toast('Idea deleted'); }
  });
  document.getElementById('m-unschedule')?.addEventListener('click', ()=>{
    idea.date = null; save(); closeModal(); render(); toast('Removed from calendar — back in the bank');
  });
  document.getElementById('m-save').addEventListener('click', ()=>{
    const title = document.getElementById('m-title').value.trim();
    if(!title){ toast('Give it a title first'); return; }
    const checkedPlatforms = Array.from(document.querySelectorAll('.m-platform-cb:checked')).map(cb=>cb.value);
    if(!checkedPlatforms.length){ toast('Pick at least one platform'); return; }
    const payload = {
      title,
      pillar: document.getElementById('m-pillar').value,
      format: document.getElementById('m-format').value,
      platforms: normalizePlatforms(checkedPlatforms),
      language: document.getElementById('m-language').value,
      status: document.getElementById('m-status').value,
      date: document.getElementById('m-date').value || null,
      notes: document.getElementById('m-notes').value,
    };
    if(editing){
      Object.assign(idea, payload);
      toast('Saved');
    } else {
      state.ideas.push({ id:newId(), ...payload });
      toast('Added to bank');
    }
    save(); closeModal(); render();
  });
}

function openPickerModal(dateIso, pillarFilter){
  const backlog = state.ideas.filter(i=>!i.date);
  let onlyPillar = !!pillarFilter;
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="overlay" id="modal-overlay">
      <div class="modal" role="dialog" aria-modal="true">
        <h3>Schedule for ${esc(fmtDay(dateIso))}</h3>
        <input type="search" id="pick-q" placeholder="Search unscheduled ideas…" style="width:100%;">
        ${pillarFilter ? `<label style="display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; color:var(--ink-2); margin-top:8px;">
          <input type="checkbox" id="pick-pillar-only" checked> Only ${esc(PILLAR_MAP[pillarFilter].label)} ideas
        </label>` : ''}
        <div class="picker-list" id="pick-list"></div>
        <div class="modal-foot">
          <span></span>
          <button class="btn" id="pick-cancel">Close</button>
        </div>
      </div>
    </div>
  `;
  function renderList(q){
    const list = backlog.filter(i=>
      i.title.toLowerCase().includes((q||'').toLowerCase()) &&
      (!onlyPillar || i.pillar===pillarFilter)
    );
    document.getElementById('pick-list').innerHTML = list.length ? list.map(i=>`
      <div class="picker-row" data-pick="${i.id}">
        <span>${esc(i.title)}</span>
        ${pillarPill(i.pillar)}
      </div>`).join('') : '<div class="empty-state" style="padding:20px;">No unscheduled ideas match. Try a new idea instead.</div>';
    document.querySelectorAll('[data-pick]').forEach(el=> el.addEventListener('click', ()=>{
      const idea = state.ideas.find(i=>i.id===el.dataset.pick);
      idea.date = dateIso; save(); closeModal(); render(); toast('Scheduled');
    }));
  }
  renderList('');
  document.getElementById('pick-q').addEventListener('input', e=> renderList(e.target.value));
  document.getElementById('pick-pillar-only')?.addEventListener('change', e=>{ onlyPillar = e.target.checked; renderList(document.getElementById('pick-q').value); });
  document.getElementById('modal-overlay').addEventListener('click', e=>{ if(e.target.id==='modal-overlay') closeModal(); });
  document.getElementById('pick-cancel').addEventListener('click', closeModal);
}

/* ============================= EXPORT / IMPORT / RESET ============================= */
async function saveFile(filename, content, mime){
  // Prefer the artifact host's downloads capability when present (it shows
  // the viewer a confirmation and hands off to the real save surface).
  if (window.claude && typeof window.claude.use === 'function'){
    try{
      const downloads = await window.claude.use('downloads');
      if (downloads){
        await downloads.save({ filename, data: content });
        toast('Saved '+filename);
        return;
      }
    }catch(err){
      if (err && err.code === 'declined') return; // user said no, stay quiet
      // fall through to the classic download link for anything else
    }
  }
  const blob = new Blob([content], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

document.getElementById('btn-export').addEventListener('click', ()=>{
  saveFile('content-ecosystem-calendar.json', JSON.stringify(state.ideas, null, 2), 'application/json');
});
document.getElementById('btn-export-csv').addEventListener('click', ()=>{
  const cols = ['Title','Pillar','Objective','Platform','Format','Language','Status','Date','Notes'];
  const rows = state.ideas.map(i=>[
    i.title, PILLAR_MAP[i.pillar].label, OBJECTIVE_MAP[PILLAR_OBJECTIVE[i.pillar]].short,
    platformLabels(i), FORMAT_MAP[i.format].label, i.language,
    STATUS_MAP[i.status].label, i.date||'', i.notes||''
  ]);
  const csv = [cols, ...rows].map(r=> r.map(v=>{
    const s = String(v==null?'':v).replace(/"/g,'""');
    return /[",\n]/.test(s) ? '"'+s+'"' : s;
  }).join(',')).join('\n');
  saveFile('content-ecosystem-calendar.csv', csv, 'text/csv');
});
document.getElementById('btn-import').addEventListener('click', ()=> document.getElementById('file-import').click());
document.getElementById('file-import').addEventListener('change', (e)=>{
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      if(!Array.isArray(data)) throw new Error('bad format');
      state.ideas = data.map(migrateIdea);
      save(); render(); toast('Imported '+data.length+' ideas');
    }catch(err){ toast('Could not read that file'); }
  };
  reader.readAsText(file);
  e.target.value='';
});
document.getElementById('btn-reset').addEventListener('click', ()=>{
  if(confirm('Replace ALL current ideas with the starter content bank? This cannot be undone.')){
    state = defaultState();
    save(); render(); toast('Reset to starter ideas');
  }
});

/* ============================= RENDER DISPATCH ============================= */
function render(){
  renderNav();
  if(state.view==='calendar') renderCalendar();
  else if(state.view==='bank') renderBank();
  else if(state.view==='production') renderProduction();
  else renderDashboard();
}
render();
</script>
